<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <!-- 「一子一气」：一颗墨子落在棋盘一角，正下方的朱砂点是它最后的一口气。深色标签栏改用白子。 -->
  <style>
    .grid { stroke: #1c1a17; stroke-opacity: .4; }
    .stone { fill: #1c1a17; }
    @media (prefers-color-scheme: dark) { .grid { stroke: #f3ede2; stroke-opacity: .45; } .stone { fill: #f3ede2; } }
  </style>
  <path class="grid" d="M4 11H36M4 29H36M11 4V36M29 4V36" stroke-width="1.4" stroke-linecap="round"/>
  <circle class="stone" cx="11" cy="11" r="8.4"/>
  <circle cx="11" cy="29" r="4" fill="#b5352a"/>
</svg>
